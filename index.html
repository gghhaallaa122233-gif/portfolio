<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غلا | مطورة واجهات أمامية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #090d16;
            font-family: 'Tahoma', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        /* إضافة أشكال هندسية دائرية في الخلفية لتعطي طابع جمالي ورسومات */
        .bg-shape-1, .bg-shape-2 {
            position: absolute;
            filter: blur(80px);
            z-index: 1;
            border-radius: 50%;
        }
        .bg-shape-1 {
            width: 300px;
            height: 300px;
            background: rgba(56, 189, 248, 0.2);
            top: 10%;
            left: 15%;
        }
        .bg-shape-2 {
            width: 350px;
            height: 350px;
            background: rgba(147, 51, 234, 0.15);
            bottom: 10%;
            right: 15%;
        }

        .portfolio-card {
            position: relative;
            z-index: 2;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 600px;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .badge {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            padding: 7px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 34px;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: 800;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.7;
        }
        .skills-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .skill-tag {
            background: rgba(56, 189, 248, 0.08);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        .cta-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
        }
        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(14, 165, 233, 0.5);
        }
    </style>
</head>
<body>

    <!-- أشكال خلفية متوهجة وجمالية -->
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <div class="portfolio-card">
        <span class="badge">✦ متاح لفرص التدريب والعمل عن بعد</span>
        <h1>مرحباً، أنا غلا ✨</h1>
        <p class="subtitle">طالبة تقنية معلومات، ومطورة واجهات أمامية (Front-End) شغوفة بتحويل الأفكار إلى تصاميم ويب تفاعلية، أنيقة، وذات طابع بصري مميز.</p>
        
        <div class="skills-container">
            <span class="skill-tag">HTML5</span>
            <span class="skill-tag">CSS3</span>
            <span class="skill-tag">JavaScript</span>
            <span class="skill-tag">UI/UX Design</span>
        </div>

        <a href="mailto:your-email@example.com" class="cta-btn">تواصل معي</a>
    </div>

</body>
</html>
